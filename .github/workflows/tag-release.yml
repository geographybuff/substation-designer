name: Tag release

# Releases the version on main. Run it by hand (Actions -> Tag release ->
# Run workflow, on main) or through the API, giving the version to release.
#
# It checks that package.json, package-lock.json and CHANGELOG.md agree on the
# version and that the tag is new, then runs the Release workflow, which builds
# and tests everything, creates the vX.Y.Z tag on this commit once every build
# has passed, and publishes the GitHub Release.
#
# The Release workflow is called directly: a tag pushed with the workflow's own
# token does not start other workflows, so its tag trigger would not fire.

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (e.g. 0.4.0). Must match package.json and a dated CHANGELOG.md section.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Release from the default branch only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow on $DEFAULT_BRANCH, not $GITHUB_REF. Merge the release PR first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        name: Check version, changelog and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/check-release.mjs "$VERSION"
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists. To release new changes, bump the version in a release PR. If the tag's own release failed, re-run that Release run instead."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Release notes preview
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Release v$VERSION from ${GITHUB_SHA::7}"
            echo
            node scripts/release-notes.mjs "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
      sha: ${{ needs.check.outputs.sha }}
