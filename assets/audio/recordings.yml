# Recorded sounds for Substation Designer: where each recording came from, its licence, its native
# mains frequency, and which clips of it the game uses.
#
# Hums, arcs and corona pulse at twice the mains frequency: 100 Hz on 50 Hz systems, 120 Hz on 60 Hz
# systems. `node scripts/build-audio.mjs <download-folder>` builds one clip per slot for `systemHz`:
# for each slot it takes the first candidate recorded on that frequency and otherwise converts the
# first candidate, resampling it by systemHz / mainsHz (speed and pitch together, so 100 Hz becomes
# 120 Hz). Clips with `followsMains: false` (switchgear, impacts) sound the same on any system and are
# never converted. A version of the game for a 50 Hz country sets `systemHz: 50`; candidates recorded
# on 50 Hz are then preferred and 60 Hz ones converted down.
#
# mainsHz is measured, not guessed: the strength of the harmonic comb at k x 100 Hz against k x 120 Hz
# (k = 1..4; 600 Hz is ignored because it belongs to both). null means the recording has no mains
# component worth measuring.
#
# Every clip is normalized to its category's loudness (maximum momentary loudness, ITU-R BS.1770,
# 400 ms window) with a peak ceiling, the same scale the game's synthesized sounds use, so no sound is
# much louder or quieter than the rest. The build writes assets/audio/sounds.json (what the game reads)
# and one Ogg Vorbis file per slot.

systemHz: 60 # every campaign site is a US cooperative

loudness:
  # Maximum momentary loudness in LUFS for each kind of sound.
  categories:
    ui: -28 # editor clicks, bus, fence, erase
    equipment: -23 # a component's operating sound when it is placed
    energize: -21 # the station closing in
    fault: -17 # arcing faults; loudest, but only 6 LU above equipment
  # Sample peak ceiling (dBFS) after normalization; transients above it are limited.
  peakCeilingDb: -1.5

# Allowed licences (SPDX ids). CC-BY needs the credit shown on the Credits screen.
licenses: [CC0-1.0, CC-BY-3.0, CC-BY-4.0, OGA-BY-3.0, OGA-BY-4.0]

slots:
  transformer-hum:
    category: equipment
    use: Under the synthesized hum when a transformer, regulator or station service transformer is placed, and when the station is energized.
    candidates:
      - { recording: bsb-2437, start: 3.5, end: 7.0, followsMains: true, highpass: 60, fadeIn: 0.2, fadeOut: 0.4 }
      - { recording: fs-395223, start: 2.0, end: 5.5, followsMains: true, highpass: 60, fadeIn: 0.2, fadeOut: 0.4 }
  corona:
    category: equipment
    use: Energized high-voltage buses and lines (100 kV and up), and when such a station is energized.
    candidates:
      - { recording: fs-809439, start: 110.0, end: 113.0, followsMains: true, highpass: 80, fadeIn: 0.2, fadeOut: 0.4 }
      - { recording: fs-347046, start: 3.0, end: 6.0, followsMains: true, highpass: 300, fadeIn: 0.2, fadeOut: 0.4 }
  flashover:
    category: fault
    use: Clearance flashovers (phase to phase, phase to ground) when a design with critical findings is energized; restarted at each reclose.
    candidates:
      - { recording: fs-367454, start: 0.0, end: 2.0, followsMains: true, highpass: 40, fadeIn: 0.0, fadeOut: 0.3 }
  arc:
    category: fault
    use: Insulation failures and transformer internal faults; the burning arc between ignition and clearing.
    candidates:
      - { recording: fs-210878, start: 0.6, end: 2.6, followsMains: true, highpass: 40, fadeIn: 0.01, fadeOut: 0.3 }
      - { recording: fs-499690, start: 18.0, end: 20.0, followsMains: true, highpass: 40, fadeIn: 0.01, fadeOut: 0.3 }
  breaker:
    category: equipment
    use: Power circuit breakers and circuit switchers closing (placement, energizing) and tripping.
    candidates:
      - { recording: fs-139970, start: 1.25, end: 2.6, followsMains: false, channels: mix, fadeIn: 0.01, fadeOut: 0.5 }
  recloser:
    category: equipment
    use: Reclosers closing (placement, energizing), tripping and reclosing onto a fault.
    candidates:
      - { recording: bsb-1092, start: 13.75, end: 14.3, followsMains: false, fadeIn: 0.005, fadeOut: 0.1 }
  switch:
    category: equipment
    use: Disconnect and hook stick switches closing.
    candidates:
      - { recording: bsb-0235, start: 0.0, end: 1.0, followsMains: false, fadeIn: 0.002, fadeOut: 0.25 }
  fuse:
    category: equipment
    use: Power fuses snapped into their mountings when placed.
    candidates:
      - { recording: bsb-1092, start: 3.97, end: 4.4, followsMains: false, fadeIn: 0.005, fadeOut: 0.1 }
  gate:
    category: ui
    use: Placing the fence (the gate swung shut).
    candidates:
      - { recording: bsb-2360, start: 0.2, end: 2.4, followsMains: false, fadeIn: 0.005, fadeOut: 0.5 }
  relay:
    category: ui
    use: Small clicks in the editor.
    candidates:
      - { recording: bsb-2191, start: 0.0, end: 0.084, followsMains: false, fadeIn: 0.0, fadeOut: 0.02 }
  blast:
    category: fault
    use: The pressure wave of an arc igniting, an expulsion fuse's report, a transformer tank rupturing.
    candidates:
      - { recording: bsb-1808, start: 0.0, end: 0.325, followsMains: false, fadeIn: 0.0, fadeOut: 0.1 }

